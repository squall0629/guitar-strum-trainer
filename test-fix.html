<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修复验证测试</title>
  <style>
    body { background: #1a1a2e; color: #fff; font-family: sans-serif; padding: 20px; }
    .test-result { margin: 10px 0; padding: 10px; border-radius: 8px; }
    .pass { background: rgba(46, 213, 115, 0.2); border: 1px solid #2ed573; }
    .fail { background: rgba(255, 71, 87, 0.2); border: 1px solid #ff4757; }
    .warn { background: rgba(255, 165, 2, 0.2); border: 1px solid #ffa502; }
  </style>
</head>
<body>
  <h1>🔧 修复验证测试</h1>
  <div id="results"></div>
  
  <script type="module">
    const results = document.getElementById('results');
    
    function addResult(test, passed, message) {
      const div = document.createElement('div');
      div.className = `test-result ${passed ? 'pass' : 'fail'}`;
      div.innerHTML = `<strong>${passed ? '✅' : '❌'} ${test}</strong><br>${message}`;
      results.appendChild(div);
    }
    
    // 测试 1: constants.js 加载
    try {
      const { DEBUG, AMPLITUDE_GOOD, APP_VERSION } = await import('./constants.js');
      addResult('constants.js 模块加载', true, 
        `DEBUG=${DEBUG}, AMPLITUDE_GOOD=${AMPLITUDE_GOOD}, APP_VERSION=${APP_VERSION}`);
    } catch (e) {
      addResult('constants.js 模块加载', false, e.message);
    }
    
    // 测试 2: chord-detector.js 加载
    try {
      const { isTonalAvailable } = await import('./chord-detector.js');
      const tonalAvailable = isTonalAvailable();
      addResult('chord-detector.js 模块加载', true, 
        `isTonalAvailable()=${tonalAvailable}${tonalAvailable ? ' (Tonal.js 已加载)' : ' (Tonal.js 未加载，功能降级)'}`);
    } catch (e) {
      addResult('chord-detector.js 模块加载', false, e.message);
    }
    
    // 测试 3: 检查全局变量污染
    const globalVars = [];
    if (window.DEBUG !== undefined) globalVars.push('DEBUG');
    if (window.AMPLITUDE_GOOD !== undefined) globalVars.push('AMPLITUDE_GOOD');
    if (globalVars.length > 0) {
      addResult('全局变量检查', false, `发现污染的全局变量：${globalVars.join(', ')}`);
    } else {
      addResult('全局变量检查', true, '无模块常量污染全局作用域 ✓');
    }
    
    // 测试 4: Tonal.js CDN 检查
    if (window.Tonal) {
      addResult('Tonal.js CDN', true, 'Tonal.js 已成功从 CDN 加载');
    } else {
      addResult('Tonal.js CDN', false, 'Tonal.js 未从 CDN 加载（检查网络连接或 CDN）', 'warn');
    }
    
    console.log('[Test] 所有模块加载测试完成');
  </script>
</body>
</html>
